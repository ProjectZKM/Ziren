[package]
name = "zkm-primitives"
description = "Ziren primitives"
readme = "../../README.md"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
bincode = "1.3.3"
hex = "0.4.3"
lazy_static = "1.5.0"
num-bigint = { version = "0.4.6", default-features = false }
p3-field = { workspace = true }
p3-koala-bear = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-symmetric = { workspace = true }
p3-monty-31 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10.8"

# The production guest ELF is built from this crate BY PATH (reth-processor
# patches `zkm-zkvm`/`zkm-lib` onto this tree), so its bytes -- and therefore
# the program vk that eth-proofs publishes -- move with any source edit here.
# Style lints are therefore silenced in the MANIFEST rather than with in-source
# `#[allow]`: a lint level reaches rustc as a flag and cannot perturb guest
# codegen, whereas editing the `.rs` would rebuild the ELF for a style fix.
[lints.clippy]
# Fires on the byte-packing loops (`chunks_exact(8)` -> `as_chunks::<8>()`).
# Rewriting them touches guest hot paths; defer to a landing that rebuilds and
# gates the ELF deliberately.
chunks_exact_to_as_chunks = "allow"
