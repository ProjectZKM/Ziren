[package]
name = "zkm-zkvm"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
zkm-lib = { path = "../lib" }
bincode = "1.3.3"
cfg-if = "1.0.0"
getrandom = { version = "0.2.14", features = ["custom"] }
rand = "0.8.5"
serde = { version = "1.0.201", features = ["derive"] }
libm = { version = "0.2.8", optional = true }
lazy_static = "1.4.0"
sha2 = { version = "0.10.8", default-features = false }
blake3 = { version = "1.8.5", default-features = false, optional = true }
zkm-primitives = { workspace = true }
p3-koala-bear  = { workspace = true, optional = true }
p3-field = { workspace = true, optional = true }
embedded-alloc = { version = "0.6.0", optional = true }
critical-section = { version = "1.2.0", optional = true }

[features]
default = ["libm", "bump"]
embedded = ["dep:embedded-alloc", "dep:critical-section"]
libm = ["dep:libm"]
bump = []
verify = [
  "dep:p3-koala-bear",
  "dep:p3-field",
  "zkm-lib/verify",
]
# Use BLAKE3 instead of SHA256 to hash the public values, matching the Groth16 wrap circuit's
# `imm-wrap-vk` mode. See `zkm-recursion-core`'s `zkm_imm_wrap_vk_mode` for the full picture.
imm-wrap-vk = ["dep:blake3"]

# The production guest ELF is built from this crate BY PATH (reth-processor
# patches `zkm-zkvm`/`zkm-lib` onto this tree), so its bytes -- and therefore
# the program vk that eth-proofs publishes -- move with any source edit here.
# Style lints are therefore silenced in the MANIFEST rather than with in-source
# `#[allow]`: a lint level reaches rustc as a flag and cannot perturb guest
# codegen, whereas editing the `.rs` would rebuild the ELF for a style fix.
[lints.clippy]
# Fires on the byte-packing loops (`chunks_exact(8)` -> `as_chunks::<8>()`).
# Rewriting them touches guest hot paths; defer to a landing that rebuilds and
# gates the ELF deliberately.
chunks_exact_to_as_chunks = "allow"

[lints.rust]
# `#![feature(asm_experimental_arch)]` is consumed by the `asm!` blocks under
# `cfg(target_os = "zkvm")` (MIPS register operands).  A host-target clippy
# build compiles those out, so the gate reads as unused there only.
unused_features = "allow"
