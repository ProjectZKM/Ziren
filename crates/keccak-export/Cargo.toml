[package]
name = "zkm-keccak-export"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
zkm-pcs = { workspace = true, features = ["keccak-terminal"] }
p3-field = { workspace = true }
p3-keccak = { workspace = true }
p3-symmetric = { workspace = true }
serde = { workspace = true }
bincode = "1.3.3"
anyhow = { workspace = true, optional = true }
hex = { version = "0.4.3", optional = true }
serde_json = { workspace = true, optional = true }
p3-air = { workspace = true, optional = true }
p3-koala-bear = { workspace = true, optional = true }
p3-uni-stark = { workspace = true, optional = true }
zkm-prover = { path = "../prover", features = ["keccak-terminal"], optional = true }
zkm-core-machine = { workspace = true, optional = true }
zkm-core-executor = { workspace = true, optional = true }
zkm-recursion-core = { workspace = true, optional = true }
zkm-primitives = { workspace = true, optional = true }

[features]
default = []
machine = ["dep:anyhow", "dep:hex", "dep:serde_json", "dep:p3-air", "dep:p3-koala-bear", "dep:p3-uni-stark", "dep:zkm-prover", "dep:zkm-core-machine", "dep:zkm-core-executor", "dep:zkm-recursion-core", "dep:zkm-primitives"]
