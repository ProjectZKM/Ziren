name: Time-consuming test

on:
  push:
    # The feature branch is gated too: with only `main` gated, an `#[ignore]`d
    # end-to-end test rotted for weeks and nothing ran it.
    branches: ["main", "feat/upgrade-plonky3"]
  # The SNARK proofs run nightly, not per push: they held the only self-hosted
  # slot for hours. A schedule runs on the default branch only, so a feature
  # branch needs `workflow_dispatch`.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# One run per branch. Without this a superseded push queues behind the run it
# replaces, on a runner that has one slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo Test
    runs-on: self-hosted-cpu
    # See ci.yml: tests prove at a quarter of the area fence, two at a time.
    env:
      RUST_TEST_THREADS: "2"
      ELEMENT_THRESHOLD: "115000000"
      # The same cache and the same flags as ci.yml's self-hosted job, so the
      # two share artifacts instead of rebuilding the workspace for each other.
      CARGO_TARGET_DIR: /data/actions-runner/cache/ziren-target
      RUSTFLAGS: "-C target-cpu=native"
    steps:
      - uses: actions/checkout@v5
      - run: export PATH=~/.cargo/bin:$PATH
      - run: |
          source ~/.zkm-toolchain/env
          cargo test -r -p zkm-core-machine
          # The gnark cases never return their R1CS and proving key, so the
          # growth is cumulative and no thread count bounds it; GOMEMLIMIT cannot
          # either, because the solver's witness is live. They run in the `snark`
          # job, one process each, and the swapfile is what keeps this box alive.
          cargo test -r -p zkm-sdk -- \
            --skip tests::test_compress_to_groth16 \
            --skip tests::test_e2e_prove_groth16 \
            --skip tests::test_e2e_prove_plonk \
            --skip tests::test_generate_dvsnark_r1cs_witness \
            --skip tests::test_groth16_public_values
          cargo test -r -p zkm-verifier
          # The recursion gates, all `#[ignore]`d for slowness and all
          # load-bearing: compress and wrap cover core->compress->shrink->wrap,
          # and the circuit gate is the only thing driving the gnark outer circuit
          # and its jagged-eval closing identity. It needs Go on the runner.
          VERIFY_VK=false cargo test -r -p zkm-prover -- --ignored --test-threads=1 \
            tests::test_e2e_compress_fibonacci \
            tests::test_e2e_wrap_fibonacci \
            tests::test_e2e_circuit_fibonacci

  snark:
    name: SNARK proofs
    # Nightly, on main, or on request. One process per case, which is what caps
    # the peak at a single case's footprint on a 123 GB runner.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: self-hosted-cpu
    env:
      RUST_TEST_THREADS: "2"
      ELEMENT_THRESHOLD: "115000000"
      CARGO_TARGET_DIR: /data/actions-runner/cache/ziren-target
      RUSTFLAGS: "-C target-cpu=native"
    steps:
      - uses: actions/checkout@v5
      - run: export PATH=~/.cargo/bin:$PATH
      - run: |
          source ~/.zkm-toolchain/env
          for t in test_compress_to_groth16 test_e2e_prove_groth16 \
                   test_e2e_prove_plonk test_generate_dvsnark_r1cs_witness \
                   test_groth16_public_values; do
            s=$(date +%s)
            cargo test -r -p zkm-sdk -- --exact "tests::$t"
            echo "::notice title=$t::$(( $(date +%s)-s ))s mem_avail=$(awk '/MemAvailable/ {print int($2/1048576)}' /proc/meminfo)GB"
          done
          # The imm-wrap-vk path, in both verifier implementations: the only
          # check that the committed IMM_GROTH16_VK_BYTES and PART_STARK_VK_BYTES
          # match the published imm archive, since this mode hashes the vk with
          # part_stark_vk and the standard suite stays green when they drift.
          # ZKM_IMM_WRAP_VK is set by the test, never exported: exporting it makes
          # zkm-build pass --features imm-wrap-vk to the plain `guests`
          # workspace, which has no such feature, and the guest build fails.
          for f in "" "--features ark"; do
            s=$(date +%s)
            cargo test -r -p zkm-verifier $f -- --ignored --exact \
              tests::test_verify_groth16_imm_wrap_vk
            echo "::notice title=imm_wrap_vk ${f:-default}::$(( $(date +%s)-s ))s mem_avail=$(awk '/MemAvailable/ {print int($2/1048576)}' /proc/meminfo)GB"
          done
