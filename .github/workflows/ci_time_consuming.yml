name: Time-consuming test

on:
  push:
    # Development happens on the feature branch; gating only `main` means an
    # `#[ignore]`d end-to-end test can rot for weeks without anyone noticing.
    # It did: `test_e2e_circuit_fibonacci` was broken from before 22efae5a
    # until ff3488dc, behind three stacked breakages, and nothing ran it.
    branches: ["main", "feat/upgrade-plonky3"]
  workflow_dispatch:

# One run per branch. Without this a superseded push queues behind the run it
# replaces, on a runner that has one slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo Test
    runs-on: self-hosted-cpu
    # See ci.yml: tests prove at a quarter of the area fence, two at a time.
    env:
      RUST_TEST_THREADS: "2"
      ELEMENT_THRESHOLD: "115000000"
      # The same cache and the same flags as ci.yml's self-hosted job, so the
      # two share artifacts instead of rebuilding the workspace for each other.
      CARGO_TARGET_DIR: /data/actions-runner/cache/ziren-target
      RUSTFLAGS: "-C target-cpu=native"
    steps:
      - uses: actions/checkout@v5
      - run: export PATH=~/.cargo/bin:$PATH
      - run: |
          source ~/.zkm-toolchain/env
          cargo test -r -p zkm-core-machine
          # Every sdk case that drives gnark loads a multi-gigabyte R1CS and
          # proving key, and the process does not return that memory when the
          # case ends. Run in one process the suite therefore climbs to 102 GiB
          # (measured) and earlyoom kills it on this 126 GB runner, which is what
          # took down two runs with no failing test. Thread count does not help,
          # because the growth is cumulative rather than concurrent. Giving each
          # of these cases its own process caps the peak at one case's footprint,
          # measured at 52 GiB, and keeps every case running.
          for t in test_compress_to_groth16 test_e2e_prove_groth16 \
                   test_e2e_prove_plonk test_generate_dvsnark_r1cs_witness \
                   test_groth16_public_values; do
            cargo test -r -p zkm-sdk -- --exact "tests::$t" --test-threads=1
          done
          cargo test -r -p zkm-sdk -- --test-threads=1 \
            --skip tests::test_compress_to_groth16 \
            --skip tests::test_e2e_prove_groth16 \
            --skip tests::test_e2e_prove_plonk \
            --skip tests::test_generate_dvsnark_r1cs_witness \
            --skip tests::test_groth16_public_values
          cargo test -r -p zkm-verifier
          # test_verify_groth16_imm_wrap_vk runs once the imm-wrap-vk Groth16
          # artifacts for v2.0.0 are published.
          # The end-to-end recursion gates.  All three are `#[ignore]`d because
          # they are slow (~110s, ~335s, ~640s), which is exactly why nothing
          # ran them -- and all three turned out to be load-bearing.  The
          # compress and wrap gates cover core->compress->shrink->wrap; the
          # circuit gate additionally drives the gnark outer circuit, which is
          # the only thing that exercises the jagged-eval closing identity, and
          # is where the column-accounting defect fixed in ff3488dc lived.
          # NOTE: the circuit gate needs the Go toolchain on the runner.
          VERIFY_VK=false cargo test -r -p zkm-prover -- --ignored --test-threads=1 \
            tests::test_e2e_compress_fibonacci \
            tests::test_e2e_wrap_fibonacci \
            tests::test_e2e_circuit_fibonacci
