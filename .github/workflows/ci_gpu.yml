name: GPU

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # github.com/consensys/gnark-ignition-verifier (imported by gnark-ffi's
  # trusted-setup package) is gone from GitHub and from proxy.golang.org;
  # the next mirror still serves the version go.sum pins, and go.sum
  # checks what it serves.
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gpu-perf:
    name: Gpu Perf
    runs-on: self-hosted-gpu
    steps:
      - uses: actions/checkout@v5
      - run: export PATH=~/.cargo/bin:$PATH
      - run: |
          BRANCH_NAME=${{ github.ref_name }}
          echo "branch: $BRANCH_NAME"
          cd /data/ziren-gpu-ci/ziren-gpu
          sh ci.sh $BRANCH_NAME
        env:
          RUSTFLAGS: "-C target-cpu=native"
