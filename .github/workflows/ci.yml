name: Cargo Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default: nothing in this workflow writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-17
          components: rustfmt
      - run: cargo fmt --all -- --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-08-17
      - run: curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/ProjectZKM/toolchain/refs/heads/main/setup.sh | sh
      - run: source ~/.zkm-toolchain/env && cd crates/test-artifacts && cargo build && cd ../..
      - name: Install Dependencies
        run: sudo apt update && sudo apt install protobuf-compiler
      - run: cargo clippy --all-targets -- -D warnings
      # `ark` is an OPTIONAL feature, so the line above never compiles
      # `groth16::ark_converter` and cannot lint a line of it.  A
      # `chunks_exact_to_as_chunks` error sat there unseen until the feature
      # was built by hand; the same blind spot hides any future lint in the
      # bounds-checked `ark` proof/VK loaders.
      - run: cargo clippy -p zkm-verifier --features ark --all-targets -- -D warnings
      - name: The published SDK must not carry the test PKI
        # `crates/sdk/tool/` holds the insecure test CA *and its private key*.
        # Without the manifest's `exclude` this listed four files, `ca.key`
        # among them, so every downloaded copy of the crate would have shipped
        # a usable signing key for the CA that `ZKM_ALLOW_INSECURE_TEST_CA`
        # opts into.  Asserted here because nothing in the source can observe
        # what `cargo package` decides to include.
        run: |
          if cargo package -p zkm-sdk --list --allow-dirty | grep -q '^tool/'; then
            echo "zkm-sdk would publish crates/sdk/tool/ -- see the exclude key in its manifest" >&2
            cargo package -p zkm-sdk --list --allow-dirty | grep '^tool/' >&2
            exit 1
          fi
  test:
    name: Cargo Test
    runs-on: self-hosted-cpu
    # The runner has 126 GB shared with other jobs.  A CPU proof of one shard at
    # the production area fence (460M cells) peaks near 77 GB, and one test per
    # core stacks several, so earlyoom kills the test binary.  Tests prove at a
    # quarter of the fence (ed25519: 26 GB) two at a time; production-size
    # shards are proved by the GPU gates.
    env:
      RUST_TEST_THREADS: "2"
      ELEMENT_THRESHOLD: "115000000"
      # `actions/checkout` cleans the workspace, and `git clean -ffdx` deletes
      # `target/` with it, so every run used to be a cold build of the whole
      # workspace. Keeping the cache outside the checkout makes runs
      # incremental. Both self-hosted jobs point at this one directory and use
      # one RUSTFLAGS, because a second value invalidates every artifact the
      # first one produced.
      CARGO_TARGET_DIR: /data/actions-runner/cache/ziren-target
      RUSTFLAGS: "-C target-cpu=native"
    # This job runs `cargo test` — contributor `build.rs` and test code as
    # NATIVE code — on a persistent self-hosted runner that also holds the
    # zkm toolchain, a warm cargo registry and its own runner credentials.
    # `pull_request` fires for forks, so without this gate anyone who can open
    # a PR (after one merged contribution, GitHub stops asking a maintainer to
    # approve) could run arbitrary code on that host.  Fork PRs still get the
    # two `ubuntu-latest` jobs; run the full suite on a branch in-repo, or via
    # workflow_dispatch, once the diff has been read.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - run: export PATH=~/.cargo/bin:$PATH
      - run: |
          source ~/.zkm-toolchain/env
          for pkg in zkm-core-executor zkm-curves zkm-derive zkm-primitives zkm-prover \
            zkm-recursion-circuit zkm-recursion-compiler zkm-recursion-core \
            zkm-recursion-gnark-ffi zkm-pcs zkm-zkvm zkm-lib; do
              cargo test -r -p $pkg
          done
        env:
          RUSTFLAGS: "-C target-cpu=native"
      - name: Verifier malformed-input guards, default AND `ark` features
        # `zkm-verifier` is absent from the loop above, so its tests ran nowhere.
        # That matters most for the `ark` loaders: they sit behind an OPTIONAL
        # feature, so a default run compiles 9 of the 12 malformed-input tests
        # and the three `groth16::ark_converter::malformed_input` ones are not
        # built at all. A regression in the bounds-checked `ark` proof/VK loaders
        # (ZR-03) would therefore be invisible until someone enabled the feature.
        # Measured: 9 tests without `--features ark`, 12 with.
        #
        # Filtered to `malformed_input` on purpose: the crate's other tests drive
        # gnark through the FFI and need prover artifacts this job does not
        # build, so an unfiltered run aborts in `ProvePlonkBn254` for reasons
        # unrelated to what this step is guarding.
        run: |
          source ~/.zkm-toolchain/env
          cargo test -r -p zkm-verifier malformed_input
          cargo test -r -p zkm-verifier --features ark malformed_input
        env:
          RUSTFLAGS: "-C target-cpu=native"
